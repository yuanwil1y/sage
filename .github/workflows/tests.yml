name: Sage tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-python:
    name: Portable Python regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest numpy soxr rapidfuzz
      - name: Streaming, OCR, model and release regressions
        run: >-
          pytest -q
          tests/test_audio_normalize_resample.py
          tests/test_vad.py
          tests/test_ocr.py
          tests/test_transcriber.py
          tests/test_runtime_models.py
          tests/test_release_validation.py
      - name: Validate release metadata
        run: python release_validation.py

  windows-python:
    name: Windows Python / supervision regressions
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install focused Windows test dependencies
        run: python -m pip install --upgrade pip pytest numpy soxr rapidfuzz pywin32
      - name: Run Windows-safe unit tests
        run: >-
          pytest -q -m "not windows_integration"
          tests/test_capture_reader.py
          tests/test_orchestrator.py
          tests/test_audio_normalize_resample.py
          tests/test_vad.py
          tests/test_runtime_models.py
          tests/test_release_validation.py
      - name: Validate release metadata
        run: python release_validation.py

  # Tests marked windows_integration intentionally require artifacts produced
  # by the native/MSIX build pipeline. They remain separate from the unit gate
  # so a missing local release artifact is never silently treated as a pass.
