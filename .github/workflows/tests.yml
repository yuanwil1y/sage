name: Sage tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-python:
    name: Portable Python regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install focused test dependencies
        run: >-
          python -m pip install --upgrade pip
          pytest==9.1.1 numpy==2.3.5 soxr==1.1.0 rapidfuzz==3.14.5
      - name: Streaming, OCR, display, model and release regressions
        run: >-
          python -m pytest -q
          tests/test_audio_normalize_resample.py
          tests/test_vad.py
          tests/test_ocr.py
          tests/test_transcriber.py
          tests/test_runtime_models.py
          tests/test_roi.py
          tests/test_display_mapping.py
          tests/test_screen_capture.py
          tests/test_release_validation.py
      - name: Validate release metadata
        run: python release_validation.py

  windows-python:
    name: Windows Python / supervision regressions
    runs-on: windows-2022
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install focused Windows test dependencies
        run: >-
          python -m pip install --upgrade pip
          pytest==9.1.1 numpy==2.3.5 soxr==1.1.0 rapidfuzz==3.14.5 pywin32==312 httpx==0.28.1
      - name: Run Windows-safe unit tests
        run: >-
          python -m pytest -q -m "not windows_integration"
          tests/test_capture_reader.py
          tests/test_orchestrator.py
          tests/test_audio_normalize_resample.py
          tests/test_vad.py
          tests/test_runtime_models.py
          tests/test_roi.py
          tests/test_display_mapping.py
          tests/test_screen_capture.py
          tests/test_pipe_server.py
          tests/test_release_validation.py
      - name: Validate release metadata
        run: python release_validation.py

  windows-artifact-integration:
    name: Windows native / Game Bar integration
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - name: Install integration test dependencies
        working-directory: backend
        run: >-
          python -m pip install --upgrade pip;
          python -m pip install pytest==9.1.1 pywin32==312 requests==2.32.5
      - name: Build native process-loopback helper
        run: |
          cmake -S native/audio-capture -B native/audio-capture/build -A x64
          cmake --build native/audio-capture/build --config Release --parallel
          if (-not (Test-Path "native/audio-capture/build/Release/valorant_audio_capture.exe")) {
            throw "native helper build did not produce valorant_audio_capture.exe"
          }
      - name: Build Game Bar local service
        run: |
          msbuild gamebar-widget\Service\SageWidgetService.csproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m
          if (-not (Test-Path "gamebar-widget/ServicePayload/SageWidgetService.exe")) {
            throw "service build did not produce SageWidgetService.exe"
          }
      - name: Compile Game Bar widget project
        run: >-
          msbuild gamebar-widget\ValorantTranslator.csproj
          /restore /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m
      - name: Run artifact-dependent Windows integration tests
        working-directory: backend
        run: >-
          python -m pytest -q -m windows_integration
          tests/test_capture_reader.py
          tests/test_widget_service.py

  # Full signed MSIX installation, Game Bar activation, VALORANT process audio,
  # and physical multi-monitor/DPI acceptance still require an interactive
  # Windows machine. CI intentionally stops at compile + local-service chain.
